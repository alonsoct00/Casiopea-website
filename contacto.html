<!DOCTYPE html>
<html data-seo-key="contact">

<head>
    <script>
        (function () {
            var lang = localStorage.getItem('casiopea-lang') || 'es';
            document.documentElement.setAttribute('lang', lang);
            if (lang !== 'es') document.documentElement.classList.add('i18n-pending');
        })();
    </script>
    <title>CASIOPEA - Contacto</title>
    <meta charset='utf-8'>
    <meta name="description" content="Escríbenos para cotizar tu próximo proyecto de animación con Casiopea.">
    <meta content='1 day' name='revisit-after'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <!-- Fonts -->
    <link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,400italic,300italic,100italic,700italic,700'
        rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Inconsolata:400,700' rel='stylesheet' type='text/css'>
    <!-- Styles -->
    <link href="stylesheets/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/style.min.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/the-casiopea-styles.css" rel="stylesheet" type="text/css" />
    <!-- HTML5 fallbacks -->
    <!--[if lt IE 9]>
    <script src="javascripts/html5shiv.js" type="text/javascript"></script>
    <script src="javascripts/respond.min.js" type="text/javascript"></script>
    <![endif]-->
</head>

<body id="contact-page">
    <div class="Noise"></div>
    <div class='container-fluid' id="casiopea-wsite">
        <header data-spy='affix'>
            <!-- Navbar component-->
            <main-header></main-header>
        </header>
        <section style='background:#917AF0; padding-top: 100px;'>
            <form action="php/email.php" method="POST" class="row" id="form" name="form">
                <div class='col-md-8 col-md-offset-2'>
                    <div class='block'>
                        <div class='title-block text-center'>
                            <h1 data-i18n="contact.title">¿Tienes un proyecto? Escríbenos:</h1>
                        </div>
                        <input class="form-element" id="name" name="name" placeholder="Nombre" data-i18n-placeholder="contact.form.name" type="text" required>
                        <input class='form-element' id='email' name='email' placeholder='E-mail' data-i18n-placeholder="contact.form.email" type='text' required>
                        <input class='form-element' id='phone' name='phone' placeholder='Teléfono' data-i18n-placeholder="contact.form.phone" type='text'>
                        <input class="form-element" id="subject" name="subject" placeholder="Asunto" data-i18n-placeholder="contact.form.subject" type="text"
                            required>
                        <textarea class='form-element' id='message' name='message' placeholder='Mensaje' data-i18n-placeholder="contact.form.message"
                            required></textarea>
                        <div class="msg" style="display:none;"></div>
                        <div class='text-center'>
                            <button class='btn btn-default' id='send' type='submit' data-i18n="contact.form.send">Enviar</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
        <section class='contact mobile-center' style='background:#917AF0'>
            <div class='block'>
                <div class='row'>
                    <div class='col-md-6'>
                        <div class="row">
                            <div class="col-md-12">
                                <p class="link-to" data-i18n="contact.workInquiryLead">¡Trabajemos juntxs! Si tienes algún proyecto y quieres colaborar con
                                    nosotras escríbenos a:</p>
                            </div>
                        </div>
                        <div class='p-link-to'>
                            <p class="link-to">
                                <span><i class='fa fa-envelope-o'></i></span>
                                <a href="mailto:somos@casiopea.mx">somos@casiopea.mx</a>
                            </p>
                        </div>
                    </div>
                    <div class='col-md-6'>
                        <div class="row">
                            <div class="col-md-12">
                                <p class="link-to" data-i18n="contact.internshipsLead">Si te interesa hacer el servicio social o prácticas profesionales,
                                    envía tu portafolio o reel y los requerimientos de tu escuela a:</p>
                            </div>
                        </div>
                        <div class='p-link-to'>
                            <p class="link-to">
                                <span><i class='fa fa-envelope-o'></i></span>
                                <a href="mailto:ss@casiopea.mx">ss@casiopea.mx</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer>
            <!-- Footer component-->
            <main-footer></main-footer>
        </footer>
    </div>
    <script src="javascripts/jquery.min.js" type="text/javascript"></script>
    <script src="javascripts/jquery.easing.1.3.js" type="text/javascript"></script>
    <script src="javascripts/jquery.mobile.custom.min.js" type="text/javascript"></script>
    <script src="javascripts/tera-slider.js" type="text/javascript"></script>
    <script src="javascripts/tera-lightbox.js" type="text/javascript"></script>
    <script src="javascripts/isotope.pkgd.min.js" type="text/javascript"></script>
    <script src="javascripts/bootstrap.min.js" type="text/javascript"></script>
    <script src="javascripts/validation.js" type="text/javascript"></script>
    <script src="javascripts/jquery.placeholder.js" type="text/javascript"></script>
    <script src="javascripts/waypoints.min.js" type="text/javascript"></script>
    <script src="javascripts/functions.js" type="text/javascript"></script>
    <script src="javascripts/i18n.js" type="text/javascript"></script>
</body>

</html>
